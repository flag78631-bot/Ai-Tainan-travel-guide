<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH11-表單練習(javascript)</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/my.css">
    <style>
        /* ==========================================================================
   CH10 表單練習自訂樣式 - 質感冷色調 (my.css)
   ========================================================================== */

        /* 修正 HTML 中使用的自訂字型粗細 */
        .fw-900 {
            font-weight: 900 !important;
        }

        /* 整體背景與字型優化 - 改為極冷調的淡灰藍背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            color: #2c3e50;
            background-color: #f0f4f8 !important;
            /* 偏冷色調的底色 */
        }

        /* 最上欄「產品建檔」美化 - 改為沉穩的深靛藍漸層，並縮小至適當比例 */
        .display-4.text-bg-primary {
            background: linear-gradient(135deg, #1e3c72, #2a5298) !important;
            /* 深邃冷藍漸層 */
            border-radius: 12px 12px 0 0;
            /* 只留上方圓角，與下方卡片結合 */
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.15);
            font-size: 2rem;
            /* 修正原本 display-4 過大的問題 */
            font-weight: 700 !important;
            letter-spacing: 4px;
            padding-top: 1.2rem !important;
            padding-bottom: 1.2rem !important;
        }

        /* 表單區塊容器 - 與上方標題完美銜接的白色卡片 */
        .col-md-6.mt-3 {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 0 0 12px 12px;
            /* 下方圓角 */
            box-shadow: 0 15px 35px rgba(30, 60, 114, 0.06);
            margin-top: 0 !important;
            /* 消除間距，讓標題與表單連成一體 */
        }

        /* 焦點狀態與外觀優化 - 採用冷藍色系（冰藍色 hover） */
        .form-control,
        .form-select {
            border: 1px solid #cdd7e2;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.15);
        }

        /* 針對含有驗證回饋的群組（配料與供應方式）進行冷色調優化 */
        #topping_group,
        #supply_group {
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            background-color: #f5f8fa;
            /* 冷灰藍底色 */
            transition: all 0.2s ease-in-out;
        }

        /* 當群組未選擇（invalid）時 */
        #topping_group.is-invalid,
        #supply_group.is-invalid {
            border-color: #e06d75;
            background-color: rgba(224, 109, 117, 0.03);
        }

        /* 當群組驗證通過（valid）時 */
        #topping_group.is-valid,
        #supply_group.is-valid {
            border-color: #4da6ff;
            /* 使用偏藍的冷色調通過色彩 */
            background-color: rgba(77, 166, 255, 0.03);
        }

        /* 隱藏 Bootstrap 預設加在群組容器上的大圖標，避免排版錯位 */
        #topping_group.is-invalid,
        #topping_group.is-valid,
        #supply_group.is-invalid,
        #supply_group.is-valid {
            background-image: none !important;
        }

        /* 狀態開關 (Switch) 優化 */
        .form-check-input:checked {
            background-color: #2a5298;
            /* 點亮時使用深冷藍 */
            border-color: #2a5298;
        }

        .form-switch .form-check-input {
            width: 2.6em;
            height: 1.4em;
            cursor: pointer;
        }

        /* 按鈕美化 - 冷色系按鈕 */
        .btn {
            padding: 0.6rem 1.6rem;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2a5298, #1e3c72);
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(42, 82, 152, 0.3);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            border: none;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
            color: #334155;
        }

        /* ==========================================================================
   產品建檔 - 明細確認區塊（下方顯示區）
   ========================================================================== */
        #s01 {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(30, 60, 114, 0.08);
            border-top: 6px solid #2a5298;
            /* 上邊框用冷藍色點綴 */
            margin-top: 2rem !important;
        }

        #s01 .display-4 {
            background: none !important;
            color: #2a5298 !important;
            font-size: 1.8rem;
            font-weight: 700;
            padding: 0 !important;
            margin-bottom: 2rem;
            box-shadow: none;
            letter-spacing: 2px;
        }

        /* 明細項目外觀 - 冷灰藍色小卡片風格 */
        #showmessage h3 {
            font-size: 1.1rem;
            color: #334155;
            background-color: #f1f5f9;
            padding: 14px 16px;
            border-left: 4px solid #2a5298;
            /* 冷藍色側邊條 */
            border-radius: 0 6px 6px 0;
            margin-bottom: 12px;
            font-weight: 500;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container pt-5">
        <div class="display-4 fw-900 text-center text-bg-primary py-2">產品建檔</div>
        <div class="row justify-content-center">
            <div class="col-md-6 mt-3">
                <div class="mb-3 form-floating">
                    <input type="text" class="form-control form-control-lg" name="" id="pname" placeholder="">
                    <label for="" class="form-label">產品名稱(字數1~6)</label>
                    <div class="valid-feedback">產品名稱符合規定</div>
                    <div class="invalid-feedback">產品名稱不符合規定</div>
                </div>

                <div class="mb-3">
                    <!-- id跟label for取一樣的名稱 這樣點文字也會回到選取數字 -->
                    <label for="pnum" class="form-label ">數量(1~10)</label>
                    <input type="number" class="form-control form-control-lg" value="1" min="1" max="10" id="pnum">
                    <div class="valid-feedback">數量符合規定</div>
                    <div class="invalid-feedback">數量不符合規定</div>
                </div>

                <!-- 使用Datalist 做出 產品簡介(規格 備註) -->
                <div class="mb-3">
                    <label for="pstandard" class="form-label">產品規格(1~6字)</label>
                    <input type="text" class="form-control form-control-lg is-invalid" placeholder="請選擇你要的規格"
                        id="pstandard" list="datalistoption">
                    <!-- list與id要對上 這樣才能把選項和選單連接起來 -->
                    <datalist id="datalistoption">
                        <option value="微糖"></option>
                        <option value="半糖"></option>
                        <option value="全糖"></option>
                        <option value="無糖"></option>
                    </datalist>
                    <div class="valid-feedback">選擇成功</div>
                    <div class="invalid-feedback">產品規格不符合規定</div>
                </div>

                <div class="mb-3">
                    <select name="" id="pcc" class="form-select form-select-lg is-invalid">
                        <option value="" disabled selected class="text-center ">請選擇容量</option>
                        <option value="特大(1250CC)">特大(1250CC)</option>
                        <option value="大(1000CC)">大(1000CC)</option>
                        <option value="中(750CC)">中(750CC)</option>
                        <option value="小(500CC)">小(500CC)</option>
                    </select>
                    <div class="valid-feedback">選擇成功</div>
                    <div class="invalid-feedback">請選擇規定容量</div>
                </div>

                <div class="mb-3 form-check form-switch">
                    <input type="checkbox" name="" id="pstatus" class="form-check-input" checked>
                    <label for="" class="form-check-label" id="pstatus_text">目前狀態:上架</label>
                </div>

                <div class="mb-3">
                    <div class="form-label fw-900">可加配料:至少要加一項</div>
                    <div id="topping_group" class="is-invalid">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input topping_item" value="珍珠">
                            <label for="" class="form-check-label">珍珠</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input topping_item" value="椰果">
                            <label for="" class="form-check-label">椰果</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input topping_item" value="粉圓">
                            <label for="" class="form-check-label">粉圓</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input topping_item" value="蒟蒻">
                            <label for="" class="form-check-label">蒟蒻</label>
                        </div>
                    </div>
                    <div class="valid-feedback">配料已選擇</div>
                    <div class="invalid-feedback">至少加一個配料</div>
                </div>

                <div class="mb-3">
                    <div class="form-label fw-900">供應方式:請至少選一項</div>
                    <div id="supply_group" class="is-invalid">
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input supply_item" name="supply" value="冷飲">
                            <label for="" class="form-check-label">冷飲</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input supply_item" name="supply" value="熱飲">
                            <label for="" class="form-check-label">熱飲</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input supply_item" name="supply" value="冷熱皆可">
                            <label for="" class="form-check-label">冷熱皆可</label>
                        </div>
                    </div>
                    <div class="valid-feedback">已選擇</div>
                    <div class="invalid-feedback">至少要選擇一供應方式</div>
                </div>

                <div class="text-end mt-4">
                    <button class="btn btn-primary" id="ok_btn">確認</button>
                    <button class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>
        <div class="row mt-5 justify-content-center d-none" id="s01">
            <div class="display-4 fw-900 text-center text-bg-primary py-2 rounded-3">產品建檔-明細確認</div>
            <div class="col-md-6">
                <div id="showmessage"></div>
                <button class="btn btn-danger mt-3 w-100">確認送出</button>
                <button class="btn btn-secondary mt-3 w-100">取消</button>
            </div>
        </div>
    </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        let flag_pname = false;
        let flag_pnum = false;
        let flag_pstandard = false;
        let flag_pcc = false;
        let flag_topping_group = false;
        let flag_supply_group = false;
        $(function () {
            //監聽#pname 一旦有人input, 執行以下功能:印出this this指的是pname
            $("#pname").on("input", function () {
                console.log($(this).val().length);
                let pname = $(this).val().trim();

                if (pname.length >= 1 && pname.length <= 6) {
                    $(this).addClass("is-valid")
                        .removeClass("is-invalid")
                    flag_pname = true
                } else {
                    $(this).addClass("is-invalid")
                        .removeClass("is-valid")
                    flag_pname = false
                }
            });

            //監聽#pnum 數字記得使用Number()
            $("#pnum").on("input", function () {
                console.log($(this).val());

                let pnum = Number($(this).val());
                if (pnum >= 1 && pnum < 11) {
                    $(this).addClass("is-valid")
                        .removeClass("is-invalid")
                    flag_pnum = true
                } else {
                    $(this).addClass("is-invalid")
                        .removeClass("is-valid")
                    flag_pnum = false
                }
            })

            //監聽#pstandard
            $("#pstandard").on("input", function () {
                console.log($(this).val().length);
                let pstandard = $(this).val().trim();

                if (pstandard.length >= 1 && pstandard.length <= 6) {
                    $(this).addClass("is-valid")
                        .removeClass("is-invalid")
                    flag_pstandard = true
                } else {
                    $(this).addClass("is-invalid")
                        .removeClass("is-valid")
                    flag_pstandard = false
                }
            })

            //監聽#pcc
            $("#pcc").on("change", function () {
                console.log($(this).val());

                let pcc = $(this).val().trim();
                if (pcc != '') {
                    $(this).addClass("is-valid")
                        .removeClass("is-invalid")
                    flag_pcc = true
                } else {
                    $(this).addClass("is-invalid")
                        .removeClass("is-valid")
                    flag_pcc = false
                }
            })

            //監聽#pstatus
            $("#pstatus").on("change", function () {
                console.log($(this).prop("checked"));

                let pstatus = $(this).prop("checked")
                if (pstatus) {
                    $("#pstatus_text").text("目前狀態:上架")
                } else {
                    $("#pstatus_text").text("目前狀態:下架")
                }
            })

            //監聽.topping_item
            $(".topping_item").on("change", function () {
                console.log($(".topping_item:checked").length);
                let leng = $(".topping_item:checked").length;
                if (leng > 0) {
                    $("#topping_group").removeClass("is-invalid")
                    $("#topping_group").addClass("is-valid")
                    flag_topping_group = true
                } else {
                    $("#topping_group").removeClass("is-valid")
                    $("#topping_group").addClass("is-invalid")
                    flag_topping_group = false
                }
            })

            $(".supply_item").on("change", function () {
                console.log($(".supply_item:checked").val());
                let supply = $(".supply_item:checked").val();
                if (supply) {
                    $("#supply_group").removeClass("is-invalid")
                    $("#supply_group").addClass("is-valid")
                    flag_supply_group = true
                } else {
                    $("#supply_group").removeClass("is-valid")
                    $("#supply_group").addClass("is-invalid")
                    flag_supply_group = false
                }
            })


            //按鈕監聽 #ok_btn
            $("#ok_btn").on("click", function () {
                if (flag_pname && flag_pnum && flag_pstandard && flag_pcc && flag_topping_group && flag_supply_group) {
                    $("#s01").removeClass("d-none")

                    //三元運算子? if為checked 輸入左邊的值, if not 輸入右邊的值
                    let pstatus = $("#pstatus").prop("checked") ? "上架" : "下架";

                    //收集可加配料
                    let toppingArray = []
                    $(".topping_item:checked").each(function () {
                        console.log($(this).val());
                        toppingArray.push($(this).val())
                    });
                    console.log(toppingArray);

                    //供應方式
                    let supply = $(".supply_item:checked").val()

                    let strHTML = `
                                    <h3>產品名稱: ${$("#pname").val()}</h3>
                                    <h3>產品數量: ${$("#pnum").val()}</h3>
                                    <h3>產品規格: ${$("#pstandard").val()}</h3>
                                    <h3>產品容量: ${$("#pcc").val()}</h3>
                                    <h3>目前狀態: ${pstatus}</h3>
                                    <h3>供應方式: ${supply}</h3>
                                    <h3>選取配料: ${toppingArray.join(",")}</h3>`;
                    $("#showmessage").html(strHTML)
                } else {
                    $("#s01").addClass("d-none")
                    Swal.fire({
                        title: "眼睛不好齁?",
                        text: "看清楚再點",
                        icon: "question"
                    });
                }
            })

        });
    </script>
</body>

</html>
