<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台南旅遊巡禮</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/my.css">
</head>
<style>
    .container {
        max-width: 70%;
    }

    .imgbox {
        height: 250px;
        background-image: url(image/car.jpg);
        background-position: center center;
        background-size: cover;
    }

    .a1 {
        height: 90px;
        width: 150px;
        margin-top: 15px;
        margin-bottom: 15px;
        text-align: center;
        line-height: 90px;
        font-weight: 900;

    }

    @media screen and (min-width:768px) {
        .box01 {
            height: 180px;
            line-height: 180px
        }
    }

    @media screen and (min-width:992px) {
        .box01 {
            height: 180px;
            border-radius: 50%;
        }
    }

    @media screen and (min-width:1200px) {
        .box01 {
            width: 200px;
            height: 220px;
            line-height: 220px;
            border-radius: 50%;
        }
    }

    .shadow-box {
        box-shadow: 0 5px 15px rgba(0, 0, 0, .3);
        border-radius: 5px;
        overflow: hidden;
        margin-top: 15px;
    }

    .roller img {
        height: 200px;

    }

    /* 餐廳內容卡片 */
    .contentbox {
        padding: 18px;
        background-color: #fff;
        min-height: 420px;
        display: flex;
        flex-direction: column;
    }


    /* 餐廳圖片 */
    .contentbox img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 12px;
        transition: .3s;
    }

    .contentbox img:hover {
        transform: scale(1.03);
    }

    /* 卡片標題 */
    .contentbox .h2 {
        font-size: 26px;
        font-weight: 900;
        color: #333;
        margin-top: 15px;
        margin-bottom: 10px;
    }

    /* 地址/介紹文字 */
    .contentbox p {
        color: #666;
        line-height: 1.8;
        font-size: 15px;

        display: block;
        height: 86px;
        overflow: hidden;

        position: relative;
    }

    .contentbox p::after {
        content: "...";
        position: absolute;
        right: 0;
        bottom: 0;
        background: white;
        padding-left: 5px;
    }

    /* 查看按鈕區 */
    .roller_box {
        text-align: right;
        margin-top: 15px;
    }


    .contentbox .btn {
        border-radius: 20px;
        padding: 8px 25px;
        font-weight: 700;
    }


    /* 外層卡片 */
    .shadow-box {
        background: white;
        box-shadow:
            0 8px 20px rgba(0, 0, 0, .15);
        border-radius: 15px;
        overflow: hidden;
        margin-top: 20px;
        transition: .3s;
    }


    /* 滑鼠浮起效果 */
    .shadow-box:hover {
        transform: translateY(-8px);
        box-shadow:
            0 15px 30px rgba(0, 0, 0, .25);
    }


    /* 手機版 */
    @media screen and (max-width:767px) {

        .contentbox {
            min-height: auto;
            padding: 15px;
        }

        .contentbox img {
            height: 180px;
        }

        .contentbox .h2 {
            font-size: 22px;
        }
    }


    /* 平板以上讓卡片高度一致 */
    @media screen and (min-width:768px) {

        .contentbox {
            height: 430px;
        }

    }
</style>

<body>
    <div class="container">
        <div class="row"></div>
        <div class="imgbox"></div>
        <div id="navbar-placeholder"></div>
        <div class="row">
            <div class="col-2 ">
                <a class="btn btn-info a1 category-btn" data-category="古蹟">古蹟</a>
            </div>
            <div class="col-2 ">
                <a class="btn btn-info a1 category-btn" data-category="美食">美食</a>
            </div>
            <div class="col-2 ">
                <a class="btn btn-info a1 category-btn" data-category="熱門景點">熱門景點</a>
            </div>
            <div class="col-2 ">
                <a class="btn btn-info a1 category-btn" data-category="自然景觀">自然景觀</a>
            </div>
            <div class="col-2 ">
                <a class="btn btn-info a1 category-btn" data-category="全部">回到全部</a>
            </div>
        </div>
        <div class="row">
            <div class="col-8">
                <input type="text" name="" id="searchInput" class="form-control border border-dark"
                    placeholder="輸入想去的景點名稱">
            </div>
        </div>
        <div class="row" id="bd">
            <div class="col-md-6 col-lg-4 ">
                <div class="roller shadow-box">
                    <div class="contentbox">
                        <img src="image/shanghai.jpg" alt="" class="img-fluid">
                        <div class="h2 text-center">標題</div>
                        <p>
                            軟體點點陽光看了在於，體育可惜女朋友實業查詢門派上漲，
                            後來長度應該也就排行榜排行榜部落格。
                        </p>
                        <div class="roller_box slide-right">
                            <button class="btn btn-primary">查看</button>
                        </div>
                    </div>
                </div>
            </div>



        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script>
        const API_BASE = "http://172.20.10.4:5000/attractions"
        $(function () {
            $.ajax({
                type: "Get",
                dataType: "json",
                url: API_BASE,
                success: function (data) {
                    console.log(data)
                    const cleandata = data.attractions.map(function (item) {
                        let name = (item.name ?? "").trim();
                        if (name == "") {
                            name = "未提供名稱";
                        }
                        let district = (item.district ?? "").trim();
                        if (district == "") {
                            district = "未提供地址";
                        }
                        let image_url = (item.image_url ?? "").trim();
                        if (image_url == "") {
                            image_url = "未提供圖片";
                        }

                        let category = (item.category ?? "").trim();
                        if (category == "") {
                            category = "未提供類型";
                        }
                        let description = (item.description ?? "").trim();
                        if (description == "") {
                            description = "未提供說明";
                        }
                        let created_at = (item.created_at ?? "").trim();
                        if (created_at == "") {
                            created_at = "未提供建立時間";
                        }

                        return {
                            id: item.id,
                            name: name,
                            district: district,
                            description: description,
                            image_url: image_url,
                            category: category,
                            created_at: created_at,
                        }
                    });
                    console.log("清洗後的資料", cleandata);

                    renderCards(cleandata);

                    // 監聽四個分類按鈕的點擊事件
                    $(".category-btn").on("click", function (e) {
                        e.preventDefault(); // 防止 <a href=""> 觸發跳轉/重新整理，這是你現在按鈕會重整頁面的原因
                        const selectedCategory = $(this).data("category"); // 從 data-category 屬性拿到分類名稱
                        const filtered = selectedCategory === "全部" ? cleandata : cleandata.filter(item => item.category === selectedCategory);
                        renderCards(filtered); // 把原本 forEach 渲染的邏輯抽成一個函式，重複使用
                    })

                    //監聽搜尋關鍵字
                    $("#searchInput").on("input", function () {
                        const keyword = $(this).val().trim();
                        const filtered = keyword === "" ? cleandata : cleandata.filter(item => item.name.includes(keyword));
                        renderCards(filtered);
                    });
                },
                error: function (err) {
                    console.log(err);
                },


            });
        });

        function renderCards(data) {
            $("#bd").empty();
            data.forEach(function (item) {
                let strHTML = `<div class="col-md-6 col-lg-4">
                            <div class="roller shadow-box">
                                <div class="contentbox">
                                    <img src="${item.image_url}" alt="" class="img-fluid">
                                    <div class="h2 text-center">${item.name}</div>
                                    <h6>${item.district}</h6>
                                    <p>${item.description}</p>
                                    <div class="roller_box slide-right">
                                        <a href="detail.html?id=${item.id}" class="btn btn-primary">查看</a>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                $("#bd").append(strHTML);
            });
        }

    </script>

</body>

</html>
