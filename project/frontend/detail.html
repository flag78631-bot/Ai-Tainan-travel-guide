<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台南旅遊巡禮｜景點詳細</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans TC", sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.7;
        }

        h1,
        h2,
        h3 {
            font-family: "Noto Serif TC", serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .wrap {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ---------- BREADCRUMB ---------- */
        .breadcrumb {
            padding: 28px 0 0;
            font-size: 13px;
            color: rgba(43, 38, 32, .5);
            letter-spacing: .5px;
        }

        .breadcrumb a {
            color: var(--indigo);
        }

        .breadcrumb a:hover {
            color: var(--vermilion);
        }

        /* ---------- DETAIL HERO ---------- */
        .detail-hero {
            padding: 24px 0 60px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 48px;
            align-items: start;
        }

        .detail-photo {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 16px 36px rgba(43, 38, 32, .16);
        }

        .detail-photo img {
            width: 100%;
            height: 420px;
            object-fit: cover;
        }

        .detail-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--vermilion);
            color: var(--paper);
            font-size: 12px;
            letter-spacing: 2px;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .detail-info .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--vermilion);
            font-size: 13px;
            letter-spacing: 3px;
            margin-bottom: 14px;
            font-weight: 700;
        }

        .detail-info .eyebrow::before {
            content: "";
            width: 24px;
            height: 1px;
            background: var(--vermilion);
        }

        .detail-info h1 {
            font-size: clamp(30px, 4vw, 42px);
            font-weight: 900;
            color: var(--indigo-deep);
            line-height: 1.3;
        }

        .meta-row {
            display: flex;
            gap: 24px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .meta-item {
            font-size: 13.5px;
            color: rgba(43, 38, 32, .6);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-item svg {
            width: 16px;
            height: 16px;
            color: var(--indigo);
        }

        .detail-desc {
            margin-top: 30px;
            padding-top: 26px;
            border-top: 1px solid rgba(43, 38, 32, .12);
            font-size: 15.5px;
            color: rgba(43, 38, 32, .78);
            line-height: 1.9;
        }

        .detail-actions {
            margin-top: 34px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 26px;
            font-size: 14.5px;
            font-weight: 500;
            letter-spacing: 1px;
            border-radius: 2px;
            cursor: pointer;
            transition: .25s;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--vermilion);
            color: var(--paper);
        }

        .btn-primary:hover {
            background: #96301F;
        }

        .btn-outline {
            border-color: var(--indigo-deep);
            color: var(--indigo-deep);
        }

        .btn-outline:hover {
            background: var(--indigo-deep);
            color: var(--paper);
        }

        @media (max-width: 860px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }

            .detail-photo img {
                height: 300px;
            }
        }

        /* ---------- STATE (loading / error) ---------- */
        .state-box {
            padding: 100px 0;
            text-align: center;
            color: rgba(43, 38, 32, .5);
            font-size: 14.5px;
        }

        .state-box a {
            color: var(--vermilion);
            font-weight: 600;
        }

        /* ---------- FOOTER ---------- */
        footer {
            background: var(--indigo-deep);
            color: rgba(245, 239, 224, .7);
            padding: 48px 0 28px;
        }

        footer .wrap {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(245, 239, 224, .12);
        }

        footer .brand {
            color: var(--paper);
        }

        footer nav {
            display: flex;
            gap: 26px;
            font-size: 14px;
        }

        .footer-bottom {
            text-align: center;
            font-size: 12.5px;
            margin-top: 22px;
            color: rgba(245, 239, 224, .4);
            letter-spacing: 1px;
        }

        /* ---------- MOBILE NAV (同 navbar.css 邏輯，保留備援) ---------- */
        @media (max-width: 767px) {
            .nav-links {
                position: fixed;
                top: 72px;
                left: 0;
                right: 0;
                background: var(--paper);
                flex-direction: column;
                gap: 0;
                border-bottom: 1px solid rgba(43, 38, 32, .12);
                display: none;
            }

            .nav-links.open {
                display: flex;
            }

            .nav-links a {
                padding: 16px 24px;
                width: 100%;
                border-top: 1px solid rgba(43, 38, 32, .08);
            }

            .nav-toggle {
                display: block;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="wrap">
            <a href="index.html" class="brand">府城<span>巡</span>禮</a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">首頁</a></li>
                <li><a href="attractions1.html">景點列表</a></li>
                <li><a href="admin.html">管理頁面</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle">☰</button>
        </div>
    </nav>

    <div class="wrap breadcrumb">
        <a href="index.html">首頁</a> ／ <a href="attractions1.html">景點列表</a> ／ <span id="crumbName">景點詳細</span>
    </div>

    <div id="content">
        <div class="state-box">資料讀取中...</div>
    </div>

    <footer>
        <div class="wrap">
            <div class="brand">府城<span style="color:#B33B2E">巡</span>禮</div>
            <nav>
                <a href="index.html">首頁</a>
                <a href="attractions1.html">景點列表</a>
                <a href="admin.html">管理頁面</a>
            </nav>
        </div>
        <div class="footer-bottom">台南旅遊巡禮｜職訓結業專題</div>
    </footer>

    <script src="js/jquery-4.0.0.js"></script>
    <script>
        const API_BASE = "http://192.168.60.11:5000/attractions";

        $(function () {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (!id) {
                showError("網址缺少景點編號，請從景點列表頁點擊「查看詳細」進入。");
                return;
            }

            $.ajax({
                type: "Get",
                dataType: "json",
                url: `${API_BASE}/${id}`,
                success: function (data) {
                    const item = data.attraction;
                    if (!item) {
                        showError("找不到這個景點的資料。");
                        return;
                    }
                    renderDetail(item);
                },
                error: function (err) {
                    console.log(err);
                    showError("找不到這個景點，可能已經被刪除或編號有誤。");
                }
            });

            document.getElementById("navToggle").addEventListener("click", function () {
                document.getElementById("navLinks").classList.toggle("open");
            });
        });

        function renderDetail(item) {
            const name = item.name || "未提供名稱";
            const district = item.district || "未提供地址";
            const category = item.category || "未提供類型";
            const image_url = item.image_url || "";
            const description = item.description || "未提供說明";
            const created_at = item.created_at || "未提供建立時間";

            document.title = `${name}｜台南旅遊巡禮`;
            $("#crumbName").text(name);

            let html = `
                <section class="detail-hero">
                    <div class="wrap detail-grid">
                        <div class="detail-photo">
                            <img src="${image_url}" alt="${name}">
                            <span class="detail-tag">${category}</span>
                        </div>
                        <div class="detail-info">
                            <div class="eyebrow">台南 · ${district}</div>
                            <h1>${name}</h1>
                            <div class="meta-row">
                                <div class="meta-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="9" r="2.5"/></svg>
                                    ${district}
                                </div>
                                <div class="meta-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21h16M5 21V10l7-6 7 6v11M9 21v-6h6v6M4 10h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    ${category}
                                </div>
                                <div class="meta-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    建檔於 ${created_at}
                                </div>
                            </div>
                            <div class="detail-desc">${description}</div>
                            <div class="detail-actions">
                                <a href="attractions1.html" class="btn btn-outline">← 回景點列表</a>
                                <a href="attractions1.html?category=${encodeURIComponent(category)}" class="btn btn-primary">看更多「${category}」景點</a>
                            </div>
                        </div>
                    </div>
                </section>
            `;
            $("#content").html(html);
        }

        function showError(msg) {
            $("#content").html(`<div class="state-box">${msg}<br><br><a href="attractions1.html">回景點列表看看</a></div>`);
        }
    </script>
</body>

</html>
