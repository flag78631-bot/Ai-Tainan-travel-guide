<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台南旅遊巡禮｜景點列表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans TC", sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.7;
        }

        h1,
        h2,
        h3 {
            font-family: "Noto Serif TC", serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .wrap {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ---------- PAGE HEADER ---------- */
        .page-header {
            background: var(--indigo-deep);
            padding: 64px 0 52px;
        }

        .page-header .label {
            font-size: 13px;
            letter-spacing: 4px;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .page-header h1 {
            font-size: clamp(30px, 4vw, 42px);
            font-weight: 900;
            color: var(--paper);
        }

        .page-header p {
            margin-top: 12px;
            color: rgba(245, 239, 224, .75);
            font-size: 14.5px;
            max-width: 480px;
        }

        /* ---------- FILTER BAR ---------- */
        .filter-bar {
            background: var(--paper-deep);
            border-bottom: 1px solid rgba(43, 38, 32, .1);
            padding: 22px 0;
            position: sticky;
            top: 72px;
            z-index: 40;
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .cat-btn {
            padding: 9px 20px;
            font-size: 13.5px;
            font-weight: 500;
            letter-spacing: 1px;
            border: 1px solid rgba(43, 38, 32, .18);
            border-radius: 20px;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            transition: .2s;
        }

        .cat-btn:hover {
            border-color: var(--vermilion);
            color: var(--vermilion);
        }

        .cat-btn.active {
            background: var(--vermilion);
            border-color: var(--vermilion);
            color: var(--paper);
        }

        .search-box {
            margin-left: auto;
            position: relative;
            min-width: 240px;
            flex: 1 1 240px;
            max-width: 320px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px;
            font-family: "Noto Sans TC", sans-serif;
            font-size: 14px;
            border: 1px solid rgba(43, 38, 32, .18);
            border-radius: 20px;
            background: var(--paper);
            color: var(--ink);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--indigo);
        }

        .search-box input::placeholder {
            color: rgba(43, 38, 32, .4);
        }

        .page-size-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            color: rgba(43, 38, 32, .6);
        }

        .page-size-box select {
            padding: 8px 12px;
            font-family: "Noto Sans TC", sans-serif;
            font-size: 13.5px;
            border: 1px solid rgba(43, 38, 32, .18);
            border-radius: 20px;
            background: var(--paper);
            color: var(--ink);
            cursor: pointer;
        }

        .page-size-box select:focus {
            outline: none;
            border-color: var(--indigo);
        }

        @media (max-width: 640px) {
            .search-box {
                max-width: none;
                flex-basis: 100%;
                order: 10;
            }
        }

        /* ---------- RESULT META ---------- */
        .result-meta {
            padding: 26px 0 4px;
            font-size: 13px;
            color: rgba(43, 38, 32, .55);
            letter-spacing: .5px;
        }

        .result-meta strong {
            color: var(--vermilion);
        }

        /* ---------- CARD GRID ---------- */
        .list-section {
            padding: 20px 0 90px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .place-card {
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 10px 24px rgba(43, 38, 32, .08);
            transition: .3s;
        }

        .place-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 32px rgba(43, 38, 32, .14);
        }

        .place-card .thumb {
            height: 200px;
            overflow: hidden;
        }

        .place-card .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .4s;
        }

        .place-card:hover .thumb img {
            transform: scale(1.06);
        }

        .place-card .body {
            padding: 22px 22px 26px;
        }

        .place-tag {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--vermilion);
            border: 1px solid var(--vermilion);
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .place-card h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--indigo-deep);
            margin-bottom: 8px;
        }

        .place-card p {
            font-size: 13.5px;
            color: rgba(43, 38, 32, .62);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .place-district {
            display: block;
            margin-top: 12px;
            font-size: 12.5px;
            color: rgba(43, 38, 32, .45);
            letter-spacing: 1px;
        }

        .view-link {
            display: inline-block;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--indigo-deep);
            border-bottom: 1px solid var(--indigo-deep);
            padding-bottom: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 0;
            color: rgba(43, 38, 32, .45);
            font-size: 14.5px;
            grid-column: 1 / -1;
        }

        @media (max-width: 991px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ---------- FOOTER ---------- */
        footer {
            background: var(--indigo-deep);
            color: rgba(245, 239, 224, .7);
            padding: 48px 0 28px;
        }

        footer .wrap {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(245, 239, 224, .12);
        }

        footer .brand {
            color: var(--paper);
        }

        footer nav {
            display: flex;
            gap: 26px;
            font-size: 14px;
        }

        .footer-bottom {
            text-align: center;
            font-size: 12.5px;
            margin-top: 22px;
            color: rgba(245, 239, 224, .4);
            letter-spacing: 1px;
        }

        /* ---------- MOBILE NAV (同 navbar.css 邏輯，保留備援) ---------- */
        @media (max-width: 767px) {
            .nav-links {
                position: fixed;
                top: 72px;
                left: 0;
                right: 0;
                background: var(--paper);
                flex-direction: column;
                gap: 0;
                border-bottom: 1px solid rgba(43, 38, 32, .12);
                display: none;
            }

            .nav-links.open {
                display: flex;
            }

            .nav-links a {
                padding: 16px 24px;
                width: 100%;
                border-top: 1px solid rgba(43, 38, 32, .08);
            }

            .nav-toggle {
                display: block;
            }
        }

        .pagination-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 48px;
            flex-wrap: wrap;
        }

        .page-btn {
            min-width: 38px;
            height: 38px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13.5px;
            font-weight: 500;
            border: 1px solid rgba(43, 38, 32, .18);
            border-radius: 6px;
            background: #fff;
            color: var(--ink);
            cursor: pointer;
            transition: .2s;
        }

        .page-btn:hover {
            border-color: var(--vermilion);
            color: var(--vermilion);
        }

        .page-btn.active {
            background: var(--vermilion);
            border-color: var(--vermilion);
            color: var(--paper);
        }

        .page-btn.disabled {
            opacity: .35;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="wrap">
            <a href="index.html" class="brand">府城<span>巡</span>禮</a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">首頁</a></li>
                <li><a href="attractions1.html" class="active">景點列表</a></li>
                <li><a href="admin.html">管理頁面</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle">☰</button>
        </div>
    </nav>

    <section class="page-header">
        <div class="wrap">
            <div class="label">ATTRACTIONS</div>
            <h1>把台南攤開來看</h1>
            <p>古蹟、美食、熱門景點、自然景觀，挑一個分類，或直接打字找你想去的地方。</p>
        </div>
    </section>

    <section class="filter-bar">
        <div class="wrap filter-row">
            <button class="cat-btn active" data-category="全部">全部</button>
            <button class="cat-btn" data-category="古蹟">古蹟</button>
            <button class="cat-btn" data-category="美食">美食</button>
            <button class="cat-btn" data-category="熱門景點">熱門景點</button>
            <button class="cat-btn" data-category="自然景觀">自然景觀</button>

            <div class="page-size-box">
                <label for="pselect">每頁顯示</label>
                <select id="pselect">
                    <option value="3">3</option>
                    <option value="6" selected>6</option>
                    <option value="9">9</option>
                    <option value="12">12</option>
                </select>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="輸入想去的景點名稱">
            </div>
    </section>

    </div>
    </section>

    <section class="list-section">
        <div class="wrap">
            <div class="result-meta" id="resultMeta"></div>
            <div class="card-grid" id="bd"></div>
            <div class="pagination-bar" id="pagination"></div>
        </div>
    </section>

    <footer>
        <div class="wrap">
            <div class="brand">府城<span style="color:#B33B2E">巡</span>禮</div>
            <nav>
                <a href="index.html">首頁</a>
                <a href="attractions1.html">景點列表</a>
                <a href="admin.html">管理頁面</a>
            </nav>
        </div>
        <div class="footer-bottom">台南旅遊巡禮｜職訓結業專題</div>
    </footer>

    <script src="js/jquery-4.0.0.js"></script>
    <script>
        const API_BASE = "http://192.168.60.11:5000/attractions";
        let cleandata = [];
        let currentCategory = "全部";
        let currentKeyword = "";
        let currentPage = 1;
        let pageSize = Number($("#pselect").val());
        let filteredData = [];

        $(function () {
            $.ajax({
                type: "Get",
                dataType: "json",
                url: API_BASE,
                success: function (data) {
                    cleandata = data.attractions.map(function (item) {
                        let name = (item.name ?? "").trim();
                        if (name == "") name = "未提供名稱";
                        let district = (item.district ?? "").trim();
                        if (district == "") district = "未提供地址";
                        let image_url = (item.image_url ?? "").trim();
                        if (image_url == "") image_url = "未提供圖片";
                        let category = (item.category ?? "").trim();
                        if (category == "") category = "未提供類型";
                        let description = (item.description ?? "").trim();
                        if (description == "") description = "未提供說明";
                        let created_at = (item.created_at ?? "").trim();
                        if (created_at == "") created_at = "未提供建立時間";

                        return {
                            id: item.id,
                            name: name,
                            district: district,
                            description: description,
                            image_url: image_url,
                            category: category,
                            created_at: created_at,
                        };
                    });

                    // 支援從首頁分類卡片帶 ?category=xxx 過來，一進頁就套用篩選
                    const params = new URLSearchParams(window.location.search);
                    const fromUrl = params.get("category");
                    if (fromUrl) {
                        currentCategory = fromUrl;
                        $(".cat-btn").removeClass("active");
                        $(`.cat-btn[data-category="${fromUrl}"]`).addClass("active");
                    }

                    applyFilters();
                },
                error: function (err) {
                    console.log(err);
                    $("#bd").html('<div class="empty-state">資料讀取失敗，請確認後端伺服器是否啟動</div>');
                }
            });

            // 監聽分類按鈕
            $(".cat-btn").on("click", function () {
                $(".cat-btn").removeClass("active");
                $(this).addClass("active");
                currentCategory = $(this).data("category");
                applyFilters();
            });

            // 監聽搜尋關鍵字
            $("#searchInput").on("input", function () {
                currentKeyword = $(this).val().trim();
                applyFilters();
            });

            $("#pagination").on("click", ".page-btn", function () {
                let page = Number($(this).data("page"));
                let totalPage = Math.ceil(filteredData.length / pageSize);

                if (page < 1 || page > totalPage) return;

                currentPage = page;
                renderPage();

                // 換頁後捲回列表頂端，體驗比較好
                $('html, body').animate({ scrollTop: $(".list-section").offset().top - 100 }, 300);
            });
            // 監聽每頁顯示筆數
            $("#pselect").on("change", function () {
                pageSize = Number($(this).val());
                currentPage = 1;   // 改變每頁筆數時也要跳回第一頁，避免頁碼超出範圍
                renderPage();
            });
        });

        function applyFilters() {
            let filtered = cleandata;

            if (currentCategory !== "全部") {
                filtered = filtered.filter(item => item.category === currentCategory);
            }
            if (currentKeyword !== "") {
                filtered = filtered.filter(item => item.name.includes(currentKeyword));
            }

            filteredData = filtered;
            currentPage = 1;   // 换分類或搜尋時一律跳回第一頁
            renderPage();
        }

        function renderPage() {
            $("#resultMeta").html(`共 <strong>${filteredData.length}</strong> 個景點`);

            let start = (currentPage - 1) * pageSize;
            let end = start + pageSize;
            let pageData = filteredData.slice(start, end);

            renderCards(pageData);
            renderPagination();
        }

        function renderCards(data) {
            $("#bd").empty();

            if (data.length === 0) {
                $("#bd").html('<div class="empty-state">找不到符合條件的景點，換個關鍵字或分類試試</div>');
                return;
            }

            data.forEach(function (item) {
                let strHTML = `<div class="place-card">
            <div class="thumb"><img src="${item.image_url}" alt="${item.name}"></div>
            <div class="body">
                <span class="place-tag">${item.category}</span>
                <h3>${item.name}</h3>
                <p>${item.description}</p>
                <span class="place-district">${item.district}</span>
                <a href="detail1.html?id=${item.id}" class="view-link">查看詳細 →</a>
            </div>
        </div>`;
                $("#bd").append(strHTML);
            });
        }
        function renderPagination() {
            let totalPage = Math.ceil(filteredData.length / pageSize);
            $("#pagination").empty();

            if (totalPage <= 1) return;   // 只有一頁就不顯示分頁列

            let strHTML = "";
            strHTML += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" data-page="${currentPage - 1}">‹ 上一頁</button>`;

            for (let i = 1; i <= totalPage; i++) {
                strHTML += `<button class="page-btn ${currentPage === i ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }

            strHTML += `<button class="page-btn ${currentPage === totalPage ? 'disabled' : ''}" data-page="${currentPage + 1}">下一頁 ›</button>`;

            $("#pagination").html(strHTML);
        }
    </script>

    <script>
        document.getElementById("navToggle").addEventListener("click", function () {
            document.getElementById("navLinks").classList.toggle("open");
        });
    </script>
</body>

</html>
