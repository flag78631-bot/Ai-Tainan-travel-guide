<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP飲品管理系統</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">

    <style>
        :root {
            /* ERP色系 */

            --primary-color: #1F3A5F;
            --secondary-color: #4A6FA5;

            --bg-main: #F4F6F9;
            --bg-sub: #E9EEF5;

            --text-main: #212529;
            --text-sub: #6C757D;

            --border-active: #AAB7C4;

            --shadow-main: rgba(0, 0, 0, .15);
        }

        body {
            background-color: var(--bg-main);
        }

        .container {
            margin-top: 50px;
        }

        .display-3 {
            color: var(--primary-color);
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        table {
            background-color: white;
            box-shadow: 0 5px 15px var(--shadow-main);
        }

        caption {
            font-size: 18px;
            font-weight: bold;
            color: var(--secondary-color);
        }

        thead {
            font-size: 18px;
        }

        tbody tr:hover {
            transform: scale(1.01);
            transition: .2s;
        }

        td {
            vertical-align: middle;
        }

        @media screen and (max-width:768px) {

            .table-rwd thead,
            caption {
                display: none;
            }

            .table-rwd tbody tr {
                display: block;
                margin-top: 15px;
                border: 2px solid var(--border-active);
                border-radius: 10px;
                background-color: white;
            }

            .table-rwd tbody tr td {
                display: block;
                overflow: hidden;
            }

            .table-rwd tbody tr td::before {
                content: attr(data-th)" : ";
                font-size: 18px;
                font-weight: bold;
                color: var(--primary-color);
                display: block;
                float: left;
                width: 35%;
                text-align: right;
                padding-right: 1em;
            }

            .table-rwd tbody tr td span {
                display: block;
                float: left;
                width: 65%;
            }
        }
    </style>
</head>

<body>
